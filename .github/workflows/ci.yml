name: Skill CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  standalone:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock
          python -m pip check
      - name: Verify archived upstream resources
        run: python tools/upstream_inventory.py --verify-only
      - name: Run independent figure tests
        run: python -m unittest discover -s tests -v
      - name: Run upstream auditor self-tests
        run: |
          python scripts/audits/audit_figure_collisions.py --self-test
          python scripts/audits/audit_panel_alignment.py --self-test
          python scripts/audits/validate_figure.py --self-test
      - name: Generate and audit a PDF fixture on demand
        run: |
          output=$(mktemp -d)
          python scripts/grouped_example.py freeze assets/groups.csv "$output/frozen.json" --expected-rows 9
          python scripts/grouped_example.py render "$output/frozen.json" "$output/pdf" means --format pdf --pdf-qa-min-pt 5
          python scripts/audits/audit_pdf_text.py "$output/pdf/means/figure.pdf" --min-pt 5
